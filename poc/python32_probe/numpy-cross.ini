[binaries]
c = '/py/build-tools/numpy-cc'
cpp = '/py/build-tools/numpy-cpp'
ar = 'arm-none-eabi-ar'
strip = 'arm-none-eabi-strip'
cython = ['/py/host-build/python', '/py/build-tools/cython-3.0.12/cython.py']
python = '/py/build-tools/numpy-python'
pkg-config = 'pkg-config'
[host_machine]
system = 'none'
cpu_family = 'arm'
cpu = 'cortex-a57'
endian = 'little'
[properties]
needs_exe_wrapper = true
longdouble_format = 'IEEE_DOUBLE_LE'
[built-in options]
c_args = ['-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mfloat-abi=softfp', '-mfpu=neon-fp-armv8', '-mtp=soft', '-fPIC', '-ftls-model=local-exec', '-fno-short-enums', '-D__SWITCH__', '-I/py/target-build', '-I/py/Python-3.11.18/Include', '-I/nx/include', '-I/opt/devkitpro/libnx32/include']
cpp_args = ['-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mfloat-abi=softfp', '-mfpu=neon-fp-armv8', '-mtp=soft', '-fPIC', '-ftls-model=local-exec', '-fno-short-enums', '-D__SWITCH__', '-I/py/target-build', '-I/py/Python-3.11.18/Include', '-I/nx/include', '-I/opt/devkitpro/libnx32/include']
c_link_args = ['-march=armv8-a+crc+crypto', '-mfloat-abi=softfp', '-mfpu=neon-fp-armv8', '-mtp=soft']
cpp_link_args = ['-march=armv8-a+crc+crypto', '-mfloat-abi=softfp', '-mfpu=neon-fp-armv8', '-mtp=soft']
